
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Home Climate</title>

	<link rel="stylesheet" href="style.css">

	<script src="script.js" defer></script>
</head>

<body>

	<div class="container">

		<header>
			<div>
				<h1>⌂ Home Climate</h1>
				<p>ESP32 Temperature Monitoring</p>
			</div>

			<span class="status" id="status">
				● CONNECTING
			</span>
		</header>

		<main>

			<!-- Temperature -->
			<section class="card main-card">

				<p class="label">ROOM TEMPERATURE</p>

				<div class="temperature">
					<span id="temperature">--</span>
					<span class="unit">°C</span>
				</div>

				<p class="description">
					Live DHT11 measurement
				</p>

			</section>

			<!-- Sensor values -->
			<section class="grid">

				<div class="card">

					<p class="label">HUMIDITY</p>

					<div class="small-value">
						<span id="humidity">--</span>%
					</div>

					<p class="description">
						Air humidity
					</p>

				</div>

				<div class="card">

					<p class="label">DISTANCE</p>

					<div class="small-value">
						<span id="distance">--</span>
						<span class="unit">cm</span>
					</div>

					<p class="description">
						Ultrasonic sensor
					</p>

				</div>

			</section>

			<!-- Temperature chart -->
			<section class="card chart-card">

				<div class="chart-header">

					<h2>Temperature history</h2>

					<span>Last 60 readings</span>

				</div>

				<canvas id="chart"></canvas>

				<p class="description" id="updated">
					Waiting for measurements...
				</p>

			</section>

			<!-- Footer -->
			<footer>
				Powered by ESP32 · Home Wi-Fi · Supabase
			</footer>

		</main>

	</div>

</body>
</html>
